name: validate-operations-lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test API
        working-directory: api
        run: npm test
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_A_LONG_RANDOM_PASSWORD/test-only-not-for-production/' .env
          sed -i 's/REPLACE_WITH_A_DIFFERENT_LONG_RANDOM_PASSWORD/test-only-grafana-password/' .env
          docker compose config --quiet
      - name: Build local service images
        run: docker compose build
