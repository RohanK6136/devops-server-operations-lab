name: validate-operations-lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test API
        working-directory: api
        run: npm test
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_A_LONG_RANDOM_PASSWORD/test-only-not-for-production/' .env
          sed -i 's/REPLACE_WITH_A_DIFFERENT_LONG_RANDOM_PASSWORD/test-only-grafana-password/' .env
          docker compose config --quiet
      - name: Build local service images
        run: docker compose build
      - name: Validate shell scripts
        run: |
          for script in ops/*.sh; do
            bash -n "$script"
            echo "Parsed successfully: $script"
          done
      - name: Run end-to-end routing, outage, recovery and database restore test
        run: bash ./ops/smoke-test.sh

  validate-windows-scripts:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @(
            "ops/windows-preflight.ps1",
            "ops/windows-lab.ps1",
            "ops/windows-setup.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List * | Out-String | Write-Host
              exit 1
            }
            Write-Host "Parsed successfully: $file"
          }
